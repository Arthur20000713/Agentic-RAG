spring:
  application:
    name: livestock-business-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/livestock_app?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:livestock_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

livestock:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    service-token: ${AI_SERVICE_TOKEN:change-me-at-least-32-characters}
    connect-timeout: 2s
    read-timeout: 3s
    chat-read-timeout: ${AI_CHAT_READ_TIMEOUT:65s}
    recovery-lease: ${AI_RECOVERY_LEASE:90s}
    chat-max-concurrent-calls: ${AI_CHAT_MAX_CONCURRENT_CALLS:8}
    chat-enabled: ${AI_CHAT_ENABLED:true}
  ai-context:
    key-prefix: "${AI_CONTEXT_KEY_PREFIX:java:ai-context:}"
    ttl: ${AI_CONTEXT_TTL:24h}
    max-bytes: ${AI_CONTEXT_MAX_BYTES:65536}
  knowledge:
    shared-root: ${SHARED_UPLOAD_ROOT:data/uploads}
    collection: ${KNOWLEDGE_COLLECTION:test}
    max-file-bytes: ${KNOWLEDGE_MAX_FILE_BYTES:104857600}
    index-deadline: ${KNOWLEDGE_INDEX_DEADLINE:10m}
    reconciliation-delay-millis: ${KNOWLEDGE_RECONCILIATION_DELAY_MS:1000}
    reconciliation-enabled: ${KNOWLEDGE_RECONCILIATION_ENABLED:true}
  security:
    jwt-secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:livestock-business-service}
    audience: ${JWT_AUDIENCE:livestock-business-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    clock-skew: ${JWT_CLOCK_SKEW:30s}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    redis-key-prefix: "java:auth:"
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,pythonAi
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

logging:
  structured:
    format:
      console: logstash
