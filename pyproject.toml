[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livestock-agentic-rag"
version = "0.1.0"
description = "Livestock Agentic RAG application layer integrated with a sibling RAG-SERVER."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "langgraph>=1.2.9,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "uvicorn>=0.27",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]
transformers = [
    "torch>=2.2",
    "transformers>=4.51",
    "accelerate>=0.30",
]
migration = [
    "mysql-connector-python>=9,<10",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "rag_server: tests that require a real sibling RAG-SERVER process",
]
