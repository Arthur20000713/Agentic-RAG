app:
  name: Livestock Agentic RAG
  environment: local
  debug: false
rag_server:
  query_mode: real
  repo_path: C:/Users/DELL/PycharmProjects/PythonProject/RAG-SERVER
  python_executable: C:/Users/DELL/PycharmProjects/PythonProject/RAG-SERVER/.venv/Scripts/python.exe
  collection: livestock_v4_2
  timeout_seconds: 30
  strict_real_mode: true
  min_mapped_score: 0.03
  min_citation_count_for_answer: 1
  low_confidence_no_answer: true
database:
  url: "sqlite:///data/app.db"
agent_runtime:
  engine: langgraph
model_router:
  enabled: true
  shadow_mode: false
  allow_low_risk_takeover: true
  takeover_task_types:
    - measurement_analysis
    - summarization
  blocked_safety_levels:
    - S3
    - S4
local_model:
  enabled: true
  provider: ollama
  endpoint: http://127.0.0.1:11434
  model: qwen2.5:7b
  timeout_seconds: 90
  max_retries: 1
  allow_final_answer: false
  device: auto
  torch_dtype: auto
  max_new_tokens: 256
  temperature: 0
primary_llm:
  enabled: true
  provider: openai
  model: gpt-5.6-luna
  base_url: https://api.a6api.com
  api_key_env: A6API_API_KEY
  timeout_seconds: 90
  max_retries: 1
model_pricing:
  primary_input_usd_per_million_tokens: 1.0
  primary_output_usd_per_million_tokens: 1.0
  local_input_usd_per_million_tokens: 0.0
  local_output_usd_per_million_tokens: 0.0
disease_llm:
  enabled: true
  shadow_mode: false
  require_rag_evidence: true
  allow_rule_fallback: true
lora:
  dataset_enabled: false
  inference_enabled: false
  registry_path: data/model_registry/model_registry.json
long_term_memory:
  write_enabled: false
  read_enabled: false
  ttl_days: 365
enhanced_safety:
  precheck_enabled: true
  final_guard_required: true
