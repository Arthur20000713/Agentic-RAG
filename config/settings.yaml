app:
  name: Livestock Agentic RAG
  environment: local
  debug: false
rag_server:
  query_mode: fake
  repo_path:
  python_executable:
  collection: default
  timeout_seconds: 5
  strict_real_mode: false
  min_mapped_score: 0.03
  min_citation_count_for_answer: 1
  low_confidence_no_answer: true
database:
  url: "sqlite:///data/app.db"
v3:
  enabled: false
model_router:
  enabled: false
  shadow_mode: true
  allow_low_risk_takeover: false
  takeover_task_types:
    - query_normalization
    - structured_extraction
    - measurement_analysis
    - summarization
  blocked_safety_levels:
    - S3
    - S4
local_model:
  enabled: false
  provider: mock
  endpoint:
  model:
  timeout_seconds: 3
  max_retries: 0
  allow_final_answer: false
lora:
  dataset_enabled: false
  inference_enabled: false
  registry_path: data/v3/model_registry.json
long_term_memory:
  write_enabled: false
  read_enabled: false
  ttl_days: 365
enhanced_safety:
  precheck_enabled: true
  final_guard_required: true
