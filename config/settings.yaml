app:
  name: Livestock Agentic RAG
  environment: local
  debug: false
rag_server:
  query_mode: real
  repo_path: C:/Users/DELL/PycharmProjects/PythonProject/RAG-SERVER
  python_executable: C:/Users/DELL/PycharmProjects/PythonProject/RAG-SERVER/.venv/Scripts/python.exe
  collection: livestock_v4_2
  timeout_seconds: 30
  strict_real_mode: true
  min_mapped_score: 0.03
  min_citation_count_for_answer: 1
  low_confidence_no_answer: true
database:
  url: "sqlite:///data/app.db"
v3:
  enabled: true
model_router:
  enabled: true
  shadow_mode: true
  allow_low_risk_takeover: false
  takeover_task_types:
    - query_normalization
    - structured_extraction
    - measurement_analysis
    - summarization
  blocked_safety_levels:
    - S3
    - S4
local_model:
  enabled: true
  provider: transformers
  endpoint:
  model: Qwen/Qwen2.5-0.5B-Instruct
  timeout_seconds: 60
  max_retries: 1
  allow_final_answer: false
  device: auto
  torch_dtype: auto
  max_new_tokens: 96
  temperature: 0
lora:
  dataset_enabled: false
  inference_enabled: false
  registry_path: data/v3/model_registry.json
long_term_memory:
  write_enabled: false
  read_enabled: false
  ttl_days: 365
enhanced_safety:
  precheck_enabled: true
  final_guard_required: true
